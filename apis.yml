aid: notti
name: Notti
description: >-
  Notti (Notti Pet Food) is a Malaysian pet-nutrition startup selling premium
  slow-baked kibble, treats, and supplements for dogs (Wou Wou) and cats (Mau
  Mau) direct-to-consumer through a Shopify storefront. Formulations emphasise
  ">=80% fresh meat", low-temperature slow-baking to preserve nutrients, no meat
  meal or by-products, and AAFCO-compliant nutrition with no chemical
  preservatives. The company is seed-funded, has been covered by Malaysian
  business press (The Edge, The Star, Business Today, Free Malaysia Today), and
  is tracked here as a 500 Global portfolio company. Notti operates as a
  consumer e-commerce and retail brand and publishes no developer API,
  documentation, or technical integration surface.
